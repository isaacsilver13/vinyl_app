# fly.toml app configuration file generated for vinyl-catalog on 2026-05-30T23:43:58-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vinyl-catalog'
primary_region = 'ewr'

[build]

[env]
  VINYL_DATA_DIR = '/data'
  VINYL_API_URL = 'https://vinyl-api.fly.dev'

[[mounts]]
  source = 'vinyl_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 10
    soft_limit = 5

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
